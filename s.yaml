edition: 3.0.0
name: chiwei-web-server
access: 'undefined'
vars:
  region: 'cn-hongkong'
  functionName: 'chiwei-web-server'
resources:
  framework:
    component: fc3
    actions:
      pre-deploy:
        - run: npm install --registry=https://registry.npmmirror.com
          path: ./code
        - run: npm run build
          path: ./code
    props:
      region: ${vars.region}
      description: Chiwei bot server
      runtime: custom.debian10
      memorySize: 1024
      timeout: 600
      logConfig: auto
      layers:
        - acs:fc:${vars.region}:official:layers/Nodejs18/versions/3
      environmentVariables:
        PATH: '/opt/nodejs18/bin:/bin'
        INTERNAL_END_POINT: ${env(INTERNAL_END_POINT)}
        OSS_ACCESS_KEY_ID: ${env(OSS_ACCESS_KEY_ID)}
        OSS_ACCESS_KEY_SECRET: ${env(OSS_ACCESS_KEY_SECRET)}
        OSS_BUCKET: ${env(OSS_BUCKET)}
        HTTP_SECRET: ${env(HTTP_SECRET)}
      customRuntimeConfig:
        command:
          - ./bootstrap
        port: 8888
      functionName: ${vars.functionName}
      code: ./code
      triggers:
        - triggerName: http-trigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - HEAD
              - OPTIONS